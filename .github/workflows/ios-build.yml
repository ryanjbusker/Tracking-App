name: iOS Build and Deploy

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Sync Capacitor
        run: |
          mkdir -p www
          cp index.html app.js styles.css sw.js manifest.webmanifest www/
          cp -r icons www/
          npx cap sync ios
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      
      - name: Install Fastlane
        run: gem install fastlane
      
      - name: Create Fastlane Appfile
        run: |
          cd ios/App
          mkdir -p fastlane
          cat > fastlane/Appfile << EOF
          app_identifier("com.ryanbusker.contrail")
          apple_id(ENV["APPLE_ID"])
          team_id(ENV["APPLE_TEAM_ID"])
          EOF
      
      - name: Create Fastlane Matchfile
        run: |
          cd ios/App
          cat > fastlane/Matchfile << EOF
          git_url(ENV["MATCH_GIT_URL"])
          storage_mode("git")
          type("appstore")
          app_identifier(["com.ryanbusker.contrail"])
          username(ENV["APPLE_ID"])
          team_id(ENV["APPLE_TEAM_ID"])
          EOF
      
      - name: Create Fastlane Fastfile
        run: |
          cd ios/App
          cat > fastlane/Fastfile << 'EOF'
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Setup CI keychain (creates temp keychain for match and gym)
              setup_ci
              
              # Set up App Store Connect API Key
              app_store_connect_api_key(
                key_id: ENV["ASC_KEY_ID"],
                issuer_id: ENV["ASC_ISSUER_ID"],
                key_content: ENV["ASC_KEY_P8"],
                is_key_content_base64: false,
                in_house: false
              )

              # Increment build number
              increment_build_number(
                xcodeproj: "App.xcodeproj",
                build_number: latest_testflight_build_number(
                  app_identifier: "com.ryanbusker.contrail",
                  initial_build_number: 0
                ) + 1
              )

              # Get/sync certificates and provisioning profiles with match
              match(
                type: "appstore",
                app_identifier: "com.ryanbusker.contrail",
                readonly: false,
                force_for_new_devices: true
              )

              # Update code signing settings for manual signing
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "App.xcodeproj",
                targets: ["App"],
                code_sign_identity: "iPhone Distribution",
                bundle_identifier: "com.ryanbusker.contrail",
                profile_name: "match AppStore com.ryanbusker.contrail",
                team_id: "R6M54WJATS"
              )

              # Build the app
              build_app(
                workspace: "App.xcworkspace",
                scheme: "App",
                configuration: "Release",
                export_method: "app-store",
                xcargs: "DEVELOPMENT_TEAM=R6M54WJATS",
                export_options: {
                  provisioningProfiles: {
                    "com.ryanbusker.contrail" => "match AppStore com.ryanbusker.contrail"
                  }
                }
              )

              # Upload to TestFlight
              if ENV["UPLOAD_TO_TESTFLIGHT"] == "true"
                upload_to_testflight(
                  skip_waiting_for_build_processing: true,
                  skip_submission: true
                )
              end
            end
          end
          EOF
      
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
      
      - name: Build and Deploy
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          UPLOAD_TO_TESTFLIGHT: ${{ github.event.inputs.upload_to_testflight || 'true' }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APP_SPECIFIC_PASSWORD }}
        run: |
          cd ios/App
          fastlane beta
      
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Contrail-iOS
          path: ios/App/*.ipa
          if-no-files-found: warn
